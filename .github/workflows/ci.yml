name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Permissões mínimas: o CI só precisa de ler o repositório.
permissions:
  contents: read

# Um novo push para o mesmo PR cancela a execução anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown:
    name: Lint de Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Verificar os ficheiros .md
        run: npx --yes markdownlint-cli2@0.24.0

  links:
    name: Links internos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Instalar o remark
        run: npm install --prefix "$RUNNER_TEMP/remark" --no-save --no-audit --no-fund remark-cli@12.0.1 remark-validate-links@13.1.0
      - name: Verificar links entre ficheiros e para secções
        run: |
          "$RUNNER_TEMP/remark/node_modules/.bin/remark" \
            --use "$RUNNER_TEMP/remark/node_modules/remark-validate-links/index.js" \
            --frail --quiet --no-stdout .

  schema-detect:
    name: Procurar o schema da base de dados
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.detect.outputs.exists }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verificar se existe database/schema.sql
        id: detect
        run: |
          if [ -f database/schema.sql ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Ainda não existe database/schema.sql: a validação do schema foi ignorada."
          fi

  schema:
    name: Schema PostgreSQL
    needs: schema-detect
    if: needs.schema-detect.outputs.exists == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          # Credenciais descartáveis: a base de dados só existe durante este job.
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Criar a base de dados a partir do schema
        env:
          PGPASSWORD: ci
        run: psql -h localhost -U ci -d ci -v ON_ERROR_STOP=1 -f database/schema.sql

  dados-sinteticos:
    name: Dados sintéticos e métricas
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Criar a base de dados a partir do schema
        env:
          PGPASSWORD: ci
        run: psql -h localhost -U ci -d ci -v ON_ERROR_STOP=1 -f database/schema.sql
      - name: Instalar dependências Python
        run: |
          python3 -m venv "$RUNNER_TEMP/a016-venv"
          "$RUNNER_TEMP/a016-venv/bin/python" -m pip install -r database/seed/requirements.txt
      - name: Verificar a carga e os prémios
        run: |
          "$RUNNER_TEMP/a016-venv/bin/python" database/seed/gerar_dados.py
          "$RUNNER_TEMP/a016-venv/bin/python" database/seed/gerar_dados.py
          "$RUNNER_TEMP/a016-venv/bin/python" - <<'PY'
          import os
          import psycopg

          with psycopg.connect(os.environ["DATABASE_URL"]) as connection:
              with connection.cursor() as cursor:
                  cursor.execute("""
                      SELECT
                          (SELECT count(*) FROM badges),
                          (SELECT count(*) FROM certificates),
                          (SELECT count(*) FROM attempts AS attempt
                           JOIN questionnaires AS questionnaire
                             ON questionnaire.id = attempt.questionnaire_id
                           WHERE questionnaire.type = 'final'
                             AND attempt.attempt_number = 1 AND attempt.score >= 85),
                          (SELECT count(*) FROM attempts AS attempt
                           JOIN questionnaires AS questionnaire
                             ON questionnaire.id = attempt.questionnaire_id
                           LEFT JOIN badges AS badge
                             ON badge.enrollment_id = attempt.enrollment_id
                            AND badge.attempt_id = attempt.id
                           LEFT JOIN certificates AS certificate
                             ON certificate.enrollment_id = attempt.enrollment_id
                            AND certificate.attempt_id = attempt.id
                           WHERE questionnaire.type = 'final'
                             AND attempt.attempt_number = 1 AND attempt.score >= 85
                             AND (badge.enrollment_id IS NULL
                                  OR certificate.enrollment_id IS NULL))
                  """)
                  counts = cursor.fetchone()
          assert counts == (67, 67, 67, 0), counts
          print("67 badges e 67 certificados válidos após duas cargas.")
          PY
      - name: Executar o protótipo das métricas
        run: >-
          "$RUNNER_TEMP/a016-venv/bin/jupyter" nbconvert --to notebook
          --execute --output "$RUNNER_TEMP/prototipo-metricas.ipynb"
          docs/metricas/prototipo-metricas.ipynb
