<text x="496.0" y="603.0" font-size="11" text-anchor="start" fill="#1a1a1a">Invariantes do agregado User:</text>
<text x="496.0" y="618.0" font-size="11" text-anchor="start" fill="#1a1a1a">- só uma conta Active inicia sessão;</text>
<text x="496.0" y="633.0" font-size="11" text-anchor="start" fill="#1a1a1a">- Minor: Active só com o email verificado e um ParentalConsent Accepted;</text>
<text x="496.0" y="648.0" font-size="11" text-anchor="start" fill="#1a1a1a">- ParentalConsent Revoked: a conta passa a Suspended;</text>
<text x="496.0" y="663.0" font-size="11" text-anchor="start" fill="#1a1a1a">- no máximo um ParentalConsent Pending ou Accepted;</text>
<text x="496.0" y="678.0" font-size="11" text-anchor="start" fill="#1a1a1a">- um UserToken usa-se uma vez e só dentro da validade.</text>
