<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="1070" viewBox="0 0 1460 1070" font-family="Helvetica, Arial, sans-serif" font-size="13">
<title>C4 nível 2: contentores</title>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#555555"/></marker></defs>
<rect width="1460" height="1070" fill="#ffffff"/>
<rect x="100" y="210" width="1260" height="690" fill="none" stroke="#444444" stroke-dasharray="8 5" rx="6"/>
<text x="112" y="888" font-weight="bold" fill="#444444">Plataforma de Literacia em Saúde [Sistema de software]</text>
<line x1="366" y1="150" x2="337" y2="270" stroke="#555555" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#a)"/>
<rect x="315" y="175" width="85" height="22" fill="#ffffff" opacity="0.92"/>
<text x="357" y="191" text-anchor="middle" font-size="12" fill="#333333">Usa [HTTPS]</text>
<line x1="820" y1="145" x2="480" y2="278" stroke="#555555" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#a)"/>
<rect x="646" y="166" width="144" height="38" fill="#ffffff" opacity="0.92"/>
<text x="718" y="182" text-anchor="middle" font-size="12" fill="#333333">Abre o link do email</text>
<text x="718" y="198" text-anchor="middle" font-size="12" fill="#333333">[HTTPS]</text>
<line x1="315" y1="410" x2="305" y2="560" stroke="#555555" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#a)"/>
<rect x="231" y="466" width="157" height="38" fill="#ffffff" opacity="0.92"/>
<text x="310" y="482" text-anchor="middle" font-size="12" fill="#333333">Pedidos da SPA, /api e</text>
<text x="310" y="498" text-anchor="middle" font-size="12" fill="#333333">ficheiros [HTTPS]</text>
<line x1="460" y1="630" x2="620" y2="630" stroke="#555555" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#a)"/>
<rect x="465" y="619" width="151" height="22" fill="#ffffff" opacity="0.92"/>
<text x="540" y="635" text-anchor="middle" font-size="12" fill="#333333">Encaminha /api [HTTP]</text>
<line x1="940" y1="630" x2="1100" y2="630" stroke="#555555" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#a)"/>
<rect x="955" y="619" width="131" height="22" fill="#ffffff" opacity="0.92"/>
<text x="1020" y="635" text-anchor="middle" font-size="12" fill="#333333">Lê e escreve [SQL]</text>
<line x1="689" y1="700" x2="598" y2="770" stroke="#555555" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#a)"/>
<rect x="559" y="724" width="170" height="22" fill="#ffffff" opacity="0.92"/>
<text x="644" y="740" text-anchor="middle" font-size="12" fill="#333333">Guarda e valida o acesso</text>
<line x1="391" y1="700" x2="482" y2="770" stroke="#555555" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#a)"/>
<rect x="371" y="716" width="131" height="38" fill="#ffffff" opacity="0.92"/>
<text x="436" y="732" text-anchor="middle" font-size="12" fill="#333333">Lê e envia</text>
<text x="436" y="748" text-anchor="middle" font-size="12" fill="#333333">[X-Accel-Redirect]</text>
<line x1="868" y1="700" x2="1171" y2="940" stroke="#555555" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#a)"/>
<rect x="966" y="821" width="137" height="22" fill="#ffffff" opacity="0.92"/>
<text x="1035" y="837" text-anchor="middle" font-size="12" fill="#333333">Envia emails [SMTP]</text>
<rect x="230" y="30" width="300" height="120" rx="18" fill="#08427b" stroke="#073b6f"/>
<text x="380.0" y="60" text-anchor="middle" font-weight="bold" font-size="15" fill="#ffffff">Utilizadores</text>
<text x="380.0" y="78" text-anchor="middle" font-size="11" fill="#ffffff">[Pessoa]</text>
<text x="380.0" y="100" text-anchor="middle" font-size="12" fill="#ffffff">Guest, Registered User, Manager e</text>
<text x="380.0" y="116" text-anchor="middle" font-size="12" fill="#ffffff">Administrator.</text>
<rect x="820" y="30" width="280" height="120" rx="18" fill="#08427b" stroke="#073b6f"/>
<text x="960.0" y="60" text-anchor="middle" font-weight="bold" font-size="15" fill="#ffffff">Guardian</text>
<text x="960.0" y="78" text-anchor="middle" font-size="11" fill="#ffffff">[Pessoa]</text>
<text x="960.0" y="100" text-anchor="middle" font-size="12" fill="#ffffff">Encarregado de educação de um menor.</text>
<rect x="160" y="270" width="320" height="140" rx="8" fill="#438dd5" stroke="#3c7fc0"/>
<text x="320.0" y="300" text-anchor="middle" font-weight="bold" font-size="15" fill="#ffffff">Aplicação web (SPA)</text>
<text x="320.0" y="318" text-anchor="middle" font-size="11" fill="#ffffff">[Contentor: React, no browser]</text>
<text x="320.0" y="340" text-anchor="middle" font-size="12" fill="#ffffff">Interface do frontoffice e do backoffice.</text>
<rect x="140" y="560" width="320" height="140" rx="8" fill="#438dd5" stroke="#3c7fc0"/>
<text x="300.0" y="590" text-anchor="middle" font-weight="bold" font-size="15" fill="#ffffff">Servidor web</text>
<text x="300.0" y="608" text-anchor="middle" font-size="11" fill="#ffffff">[Contentor: Nginx]</text>
<text x="300.0" y="630" text-anchor="middle" font-size="12" fill="#ffffff">Entrega a SPA, encaminha /api para a API e</text>
<text x="300.0" y="646" text-anchor="middle" font-size="12" fill="#ffffff">envia os ficheiros.</text>
<rect x="620" y="560" width="320" height="140" rx="8" fill="#438dd5" stroke="#3c7fc0"/>
<text x="780.0" y="590" text-anchor="middle" font-weight="bold" font-size="15" fill="#ffffff">API</text>
<text x="780.0" y="608" text-anchor="middle" font-size="11" fill="#ffffff">[Contentor: Python, Flask]</text>
<text x="780.0" y="630" text-anchor="middle" font-size="12" fill="#ffffff">Regras de negócio, autenticação e</text>
<text x="780.0" y="646" text-anchor="middle" font-size="12" fill="#ffffff">permissões. API REST em JSON.</text>
<path d="M1100,572 a110.0,12 0 0,0 220,0 v116 a110.0,12 0 0,1 -220,0 z" fill="#438dd5" stroke="#3c7fc0"/>
<ellipse cx="1210.0" cy="572" rx="110.0" ry="12" fill="#438dd5" stroke="#3c7fc0"/>
<text x="1210.0" y="600" text-anchor="middle" font-weight="bold" font-size="15" fill="#ffffff">Base de dados</text>
<text x="1210.0" y="618" text-anchor="middle" font-size="11" fill="#ffffff">[Contentor: PostgreSQL 18]</text>
<text x="1210.0" y="640" text-anchor="middle" font-size="12" fill="#ffffff">Utilizadores, recursos,</text>
<text x="1210.0" y="656" text-anchor="middle" font-size="12" fill="#ffffff">respostas e indicadores.</text>
<path d="M380,782 a160.0,12 0 0,0 320,0 v66 a160.0,12 0 0,1 -320,0 z" fill="#438dd5" stroke="#3c7fc0"/>
<ellipse cx="540.0" cy="782" rx="160.0" ry="12" fill="#438dd5" stroke="#3c7fc0"/>
<text x="540.0" y="810" text-anchor="middle" font-weight="bold" font-size="15" fill="#ffffff">Ficheiros multimédia</text>
<text x="540.0" y="828" text-anchor="middle" font-size="11" fill="#ffffff">[Volume]</text>
<text x="540.0" y="850" text-anchor="middle" font-size="12" fill="#ffffff">Imagens, PDF, vídeos e certificados.</text>
<rect x="1100" y="940" width="280" height="110" rx="8" fill="#999999" stroke="#8a8a8a"/>
<text x="1240.0" y="970" text-anchor="middle" font-weight="bold" font-size="15" fill="#ffffff">Email Service</text>
<text x="1240.0" y="988" text-anchor="middle" font-size="11" fill="#ffffff">[Sistema externo: SMTP]</text>
<text x="1240.0" y="1010" text-anchor="middle" font-size="12" fill="#ffffff">Entrega os emails.</text>
</svg>
